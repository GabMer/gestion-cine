<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistema de gestión de cine para administrar películas y venta de entradas."
    />
    <title>Sistema de Gestión de Cine</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <p class="eyebrow">Gestión de cine</p>
          <h1>Sistema de Gestión de Cine</h1>
          <p class="page-header__message">Administra la cartelera y los horarios de tus salas.</p>
        </div>
        <div class="welcome__status" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          Sistema listo
        </div>
      </header>

      <section class="panel" aria-labelledby="peliculas-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Catálogo</p>
            <h2 id="peliculas-heading">Películas</h2>
          </div>
          <span id="form-title" class="section-heading__hint">Nueva película</span>
        </div>

        <form id="pelicula-form" class="movie-form">
          <input type="hidden" id="pelicula-id" />
          <label>Título <input id="titulo" name="titulo" type="text" required /></label>
          <label>Género <input id="genero" name="genero" type="text" required /></label>
          <label>Duración (min) <input id="duracionMinutos" name="duracionMinutos" type="number" min="1" required /></label>
          <label>Horario <input id="horario" name="horario" type="text" placeholder="20:00" required /></label>
          <label>Sala <input id="sala" name="sala" type="text" required /></label>
          <label>Precio de entrada <input id="precioEntrada" name="precioEntrada" type="number" min="0.01" step="0.01" required /></label>
          <label class="checkbox-label"><input id="cartelera" name="cartelera" type="checkbox" checked /> En cartelera</label>
          <div class="form-actions">
            <button type="submit" id="submit-button">Agregar película</button>
            <button type="button" id="cancel-button" class="button-secondary" hidden>Cancelar edición</button>
          </div>
        </form>
        <p id="form-message" class="form-message" role="alert"></p>
      </section>

      <section class="panel" aria-labelledby="listado-heading">
        <div class="section-heading">
          <h2 id="listado-heading">Cartelera registrada</h2>
          <span id="movie-count" class="movie-count">0 películas</span>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Título</th><th>Género</th><th>Duración</th><th>Horario</th><th>Sala</th><th>Precio</th><th>Estado</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody id="peliculas-body"></tbody>
          </table>
          <p id="empty-state" class="empty-state">Todavía no hay películas registradas.</p>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
